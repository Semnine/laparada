<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar La Parada · Sistema</title>
<meta name="description" content="Carta, pedidos en mesa con NFC, avisos a camareros, pantallas de cocina y barra y panel del Bar La Parada, Almendralejo.">
<meta name="theme-color" content="#fbf6ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&family=Caveat:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  /* Un mundo: papel, lápiz y rojo La Parada. Cliente en letra a mano; personal en letra clara. Cocina en oscuro. */
  --papel:#fbf6ea; --papel-2:#f3ead4; --papel-3:#e9dcbf; --blanco:#fffdf8;
  --tinta:#1f1b17; --tinta-2:#4b433b; --tinta-3:#7a6f63; --linea:#ddd0b4;
  --rojo:#d8262f; --rojo-osc:#a11b22; --amarillo:#f2c14e; --azul:#3e7cb1; --azul-claro:#a9cbe8;
  --ok:#2f7d32; --aviso:#b86e00; --critico:#c4202a;
  --display:"Luckiest Guy","Impact","Arial Black",sans-serif;
  --mano:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --nota:"Caveat","Segoe Print",cursive;
  --ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --borde-mano:255px 16px 225px 16px/16px 225px 16px 255px;
  --sombra:4px 4px 0 var(--tinta);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--mano);font-size:18px;line-height:1.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px dashed var(--rojo);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}

/* ---------- piezas comunes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--blanco);border:2.5px solid var(--tinta);
  border-radius:var(--borde-mano);box-shadow:3px 3px 0 var(--tinta);font-size:17px;line-height:1.1;text-decoration:none;transition:transform .1s,box-shadow .1s;min-height:44px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--tinta)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.btn.rojo{background:var(--rojo);color:#fff}
.btn.amar{background:var(--amarillo)}
.btn.verde{background:var(--ok);color:#fff}
.btn.osc{background:var(--tinta);color:var(--papel)}
.btn.peq{padding:6px 12px;font-size:15px;min-height:36px;box-shadow:2px 2px 0 var(--tinta)}
.btn.ancho{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--tinta)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:14px;border:1.5px solid currentColor;line-height:1.2;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.aviso{color:var(--aviso)}.pill.critico{color:var(--critico)}
.vivo{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e7f4e4;color:#245c26;border:1.5px solid #9cc996}
.vivo i{width:8px;height:8px;border-radius:50%;background:#2f9e3a;animation:pulso 1.6s infinite}
.vivo.local{background:#fff3d6;color:#7a4b00;border-color:#e5c37a}
.vivo.local i{background:#d98a00}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(47,158,58,.6)}70%{box-shadow:0 0 0 7px rgba(47,158,58,0)}100%{box-shadow:0 0 0 0 rgba(47,158,58,0)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:var(--tinta);color:var(--papel);
  font-family:var(--ui);font-size:15px;font-weight:600;padding:12px 18px;border-radius:14px;box-shadow:4px 4px 0 var(--rojo);max-width:min(92vw,520px);animation:sube .25s ease-out}
@keyframes sube{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.vacio{font-family:var(--nota);font-size:24px;color:var(--tinta-3);text-align:center;padding:26px 10px}

/* ============ INICIO ============ */
.inicio{max-width:1120px;margin:0 auto;padding:28px 20px 50px}
.ini-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.ini-top img{width:min(300px,62vw);height:auto;display:block}
.ini-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin:18px 0 26px}
@media (max-width:820px){.ini-hero{grid-template-columns:1fr}}
.ini-hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.4vw,60px);line-height:1.02;margin:0;color:var(--rojo);text-shadow:2px 2px 0 var(--tinta),3px 3px 0 var(--tinta);letter-spacing:.01em;text-wrap:balance}
.ini-hero p{font-size:21px;color:var(--tinta-2);margin:12px 0 0;max-width:46ch}
.ini-hero svg.escena{width:100%;height:auto}
.pantallas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.pantallas{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.pantallas{grid-template-columns:1fr}}
.pant{position:relative;display:grid;grid-template-columns:auto 1fr;align-content:start;gap:6px 14px;padding:16px;background:var(--blanco);border:2.5px solid var(--tinta);border-radius:var(--borde-mano);
  box-shadow:var(--sombra);text-decoration:none;transition:transform .12s,box-shadow .12s}
.pant:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--tinta)}
.pant .ico{grid-row:span 2;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--tinta)}
.pant .ico svg{width:28px;height:28px}
.pant h2{margin:0;font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:.02em;line-height:1.1}
.pant p{margin:0;font-size:16px;color:var(--tinta-2)}
.pant .quien{position:absolute;top:-11px;right:14px;font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--tinta);color:var(--papel);padding:2px 9px;border-radius:999px}
.mesas-rapidas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;grid-column:1/-1}
.mesas-rapidas a{font-family:var(--display);font-size:15px;width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--tinta);border-radius:50%;text-decoration:none;background:var(--papel);padding-top:2px}
.mesas-rapidas a.ab{background:var(--amarillo)}
.como{margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:paso}
@media (max-width:820px){.como{grid-template-columns:1fr 1fr}}
.como li{list-style:none;background:var(--papel-2);border:2px dashed var(--tinta);border-radius:14px;padding:14px;font-size:17px;counter-increment:paso}
.como li::before{content:counter(paso);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--rojo);color:#fff;font-family:var(--display);font-size:16px;margin-right:8px;padding-top:2px}
.ini-pie{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-family:var(--ui);font-size:14px;color:var(--tinta-3)}

/* ============ CARTA PÚBLICA ============ */
.carta{max-width:880px;margin:0 auto;padding:0 18px 40px}
.carta header{text-align:center;padding:20px 0 4px;position:relative}
.carta header .logo{display:block;width:min(420px,84%);height:auto;margin:0 auto}
.ciudad{font-size:18px;letter-spacing:.2em;margin:4px 0 0}
.ciudad::before,.ciudad::after{content:"•";color:var(--rojo);margin:0 .6em}
.carta .escena{display:block;width:100%;max-width:760px;height:auto;margin:6px auto 0}
.claim{font-family:var(--nota);font-size:27px;color:var(--tinta-2);margin:2px 0 10px;text-wrap:balance}
.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.volver{position:absolute;left:0;top:18px;font-family:var(--ui);font-size:14px;font-weight:700;text-decoration:none;color:var(--tinta-2);display:inline-flex;gap:6px;align-items:center}
nav.ruta{position:sticky;top:0;z-index:30;background:rgba(251,246,234,.96);backdrop-filter:blur(6px);border-bottom:2px dashed rgba(31,27,23,.25);margin:16px -18px 0}
.ruta-scroll{overflow-x:auto;scrollbar-width:none}
.ruta-scroll::-webkit-scrollbar{display:none}
.ruta ol{list-style:none;display:flex;margin:0 auto;padding:12px 18px 8px;width:max-content;min-width:100%;justify-content:center;position:relative}
.ruta li{position:relative;flex:none}
.ruta li+li::before{content:"";position:absolute;left:-50%;right:50%;top:16px;height:4px;background:repeating-linear-gradient(90deg,var(--tinta) 0 10px,transparent 10px 16px)}
.ruta a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;min-width:88px;padding:0 6px}
.ruta .stop{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--tinta);display:grid;place-items:center;font-family:var(--display);font-size:13px;padding-top:2px;transition:background .2s,transform .2s}
.ruta .nom{font-size:16px;white-space:nowrap}
.ruta a[aria-current="true"] .stop{background:var(--rojo);color:#fff;transform:scale(1.25)}
.ruta a[aria-current="true"] .nom{color:var(--rojo-osc);font-weight:700}
.destacados{margin:18px 0 6px}
.destacados h2{font-family:var(--nota);font-size:28px;margin:0 0 6px;font-weight:700}
.tira{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding:4px 4px 12px;scroll-snap-type:x mandatory}
.tira .dest{scroll-snap-align:start;background:var(--amarillo);border:2.5px solid var(--tinta);border-radius:var(--borde-mano);padding:12px 14px;box-shadow:3px 3px 0 var(--tinta);display:grid;gap:4px;text-align:left}
.tira .dest b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em;line-height:1.1}
.tira .dest span{font-size:15px}
.herr{display:grid;gap:10px;padding:14px 0 4px}
.buscar{position:relative}
.buscar input{width:100%;font-size:19px;padding:11px 14px 11px 44px;background:#fff;border:2.5px solid var(--tinta);border-radius:12px 225px 15px 255px/255px 15px 225px 12px}
.buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px}
.filtro-t{font-family:var(--nota);font-size:23px;margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--tinta);background:#fff;padding:4px 11px;border-radius:999px 30px 999px 40px;font-size:16px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);text-decoration:line-through;text-decoration-color:var(--rojo);text-decoration-thickness:2px}
.aviso-filtro{font-size:16px;color:var(--rojo-osc);min-height:1.3em;margin:0}
section.parada{padding-top:24px}
.p-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px}
.p-head svg{width:60px;height:60px;flex:none}
.p-num{font-family:var(--nota);font-size:23px;color:var(--tinta-3);line-height:1;display:block}
.parada h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,44px);line-height:1;margin:2px 0 0;color:var(--rojo);text-shadow:2px 2px 0 var(--tinta),3px 3px 0 var(--tinta);letter-spacing:.02em}
.p-nota{font-family:var(--nota);font-size:22px;margin:-2px 0 12px;color:var(--tinta-2)}
.platos{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.platos{grid-template-columns:1fr 1fr}}
.plato{position:relative;padding:14px 16px;background:rgba(255,255,255,.78);border:2.5px solid var(--tinta);border-radius:var(--borde-mano);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-content:start;transition:transform .12s}
.plato:nth-child(even){border-radius:15px 225px 15px 255px/255px 15px 225px 15px}
.plato h3{margin:0;font-size:22px;line-height:1.12;font-weight:400}
.plato .desc{margin:0;grid-column:1/-1;color:var(--tinta-2);font-size:17px}
.precio{font-family:var(--display);font-size:21px;color:var(--rojo);white-space:nowrap;font-variant-numeric:tabular-nums;background:linear-gradient(transparent 62%,rgba(242,193,78,.75) 62%,rgba(242,193,78,.75) 90%,transparent 90%);padding:0 3px}
.precio small{font-family:var(--mano);font-size:14px;color:var(--tinta-3);display:block;text-align:right;background:none}
.alerg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.al{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:0 7px 0 3px;border:1.5px solid var(--tinta);border-radius:999px;background:var(--papel)}
.al i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff;font-family:var(--display);padding-top:1px}
.pie-plato{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.ver3d{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;background:var(--amarillo);border:2.5px solid var(--tinta);border-radius:20px 225px 18px 255px/255px 18px 225px 20px;font-size:16px;box-shadow:2px 2px 0 var(--tinta);min-height:38px}
.etq{font-family:var(--nota);font-size:21px;color:var(--rojo-osc);transform:rotate(-3deg);display:inline-block}
.plato.agotado{opacity:.62}
.plato.agotado::after{content:attr(data-agot);position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg);font-family:var(--display);font-size:22px;color:var(--critico);border:3px solid var(--critico);padding:3px 10px 0;border-radius:8px;background:rgba(255,253,248,.85);letter-spacing:.04em}
.banda3d{margin:20px 0 4px;padding:14px 16px;background:var(--azul-claro);border:2.5px solid var(--tinta);border-radius:15px 255px 15px 225px/225px 15px 255px 15px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:var(--sombra)}
.banda3d svg{width:58px;height:58px}
.banda3d p{margin:0;font-size:17px}
.banda3d strong{font-family:var(--display);font-weight:400;font-size:22px;display:block;letter-spacing:.02em}
.leyenda{margin-top:30px;padding:16px;border:2px dashed var(--tinta);border-radius:12px}
.leyenda h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px;color:var(--rojo)}
.leyenda ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.leyenda li{display:flex;align-items:center;gap:8px;font-size:16px}
.leyenda p{font-size:15px;color:var(--tinta-2);margin:12px 0 0}
.carta footer{padding:24px 0 10px;text-align:center}
.firma{font-family:var(--nota);font-size:24px;margin:12px 0 0}

/* visor 3D */
dialog.visor{width:min(560px,94vw);max-height:92vh;padding:0;border:3px solid var(--tinta);border-radius:18px;background:var(--papel);color:var(--tinta);box-shadow:6px 6px 0 var(--tinta);overflow:hidden}
dialog.visor::backdrop{background:rgba(31,27,23,.6)}
.v-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 6px}
.v-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--rojo);line-height:1.05}
.v-head p{margin:2px 0 0;font-family:var(--nota);font-size:20px;color:var(--tinta-2)}
.cerrar{background:#fff;border:2.5px solid var(--tinta);border-radius:50%;width:42px;height:42px;flex:none;font-size:24px;line-height:1;display:grid;place-items:center}
model-viewer{width:100%;height:min(52vh,400px);background:radial-gradient(circle at 50% 40%,#fff 0,var(--papel-2) 70%)}
.v-pie{padding:10px 16px 16px;display:grid;gap:4px;text-align:center;font-size:15px;color:var(--tinta-2)}

/* ============ MESA (cliente) ============ */
.app-mesa{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--papel);position:relative}
@media (min-width:560px){.app-mesa{border-left:2px solid var(--linea);border-right:2px solid var(--linea)}}
.m-cab{position:sticky;top:0;z-index:20;background:rgba(251,246,234,.97);backdrop-filter:blur(6px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:2px dashed rgba(31,27,23,.25);display:flex;align-items:center;gap:12px}
.m-num{flex:none;width:58px;height:58px;border-radius:50%;background:var(--rojo);color:#fff;border:3px solid var(--tinta);display:grid;place-items:center;font-family:var(--display);font-size:26px;line-height:1;padding-top:3px;box-shadow:2px 2px 0 var(--tinta)}
.m-num small{display:block;font-size:10px;letter-spacing:.08em;margin-bottom:-6px}
.m-cab .t{font-family:var(--display);font-size:20px;color:var(--rojo);line-height:1}
.m-cab .s{font-size:15px;color:var(--tinta-2)}
.m-cuerpo{padding:12px 16px 20px;display:grid;gap:12px;flex:1;align-content:start}
.m-hola{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;color:var(--rojo);margin:0;text-wrap:balance}
.m-texto{margin:0;color:var(--tinta-2);font-size:18px}
.estado-ped{background:#fff;border:2.5px solid var(--tinta);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.estado-ped h4{margin:0;font-weight:400;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.estado-ped .items{font-size:15px;color:var(--tinta-2)}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pasos span{font-size:13px;text-align:center;padding-top:4px;border-top:6px solid #e4d8be;color:var(--tinta-3);border-radius:3px}
.pasos span.on{border-color:var(--ok);color:var(--tinta)}
.pasos span.ahora{border-color:var(--aviso);color:var(--tinta);font-weight:700}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;position:sticky;top:83px;z-index:10;background:var(--papel)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:2px solid var(--tinta);background:#fff;border-radius:999px 30px 999px 40px;padding:5px 12px;font-size:16px;min-height:38px}
.cats button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;background:#fff;border:2px solid var(--tinta);border-radius:var(--borde-mano)}
.item h4{margin:0;font-weight:400;font-size:19px;line-height:1.12}
.item .pr{font-family:var(--display);color:var(--rojo);font-size:17px;font-variant-numeric:tabular-nums}
.item .ds{grid-column:1;font-size:14px;color:var(--tinta-3)}
.item .acc{grid-column:2;grid-row:2 / span 2;justify-self:end;align-self:end;display:flex;align-items:center;gap:6px}
.item.agot{opacity:.55}
.item .agot-t{font-family:var(--display);font-size:13px;color:var(--critico);letter-spacing:.04em}
.cant{display:flex;align-items:center;gap:6px}
.cant button{width:36px;height:36px;border-radius:50%;border:2px solid var(--tinta);background:var(--amarillo);font-family:var(--display);font-size:19px;line-height:1;padding-top:3px}
.cant span{min-width:18px;text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums}
.mini3d{width:36px;height:36px;border-radius:50%;border:2px solid var(--tinta);background:#fff;display:grid;place-items:center}
.m-pie{position:sticky;bottom:0;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(251,246,234,.97);backdrop-filter:blur(6px);border-top:2px dashed rgba(31,27,23,.25);display:grid;gap:8px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cesta{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:18px}
.cesta .n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:999px;background:#fff;color:var(--rojo);font-family:var(--display);font-size:15px;padding:2px 6px 0;margin-right:8px}
.bump{animation:bump .35s ease-out}
@keyframes bump{30%{transform:scale(1.06)}}
.hoja-fondo{position:fixed;inset:0;background:rgba(31,27,23,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.hoja{width:100%;max-width:520px;background:var(--papel);border-top:3px solid var(--tinta);border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;max-height:88vh;overflow:auto;animation:hoja .22s ease-out}
@keyframes hoja{from{transform:translateY(40px)}}
.hoja .asa{width:46px;height:5px;border-radius:5px;background:var(--linea);justify-self:center}
.hoja h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--rojo)}
.lin{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:17px}
.lin .q{font-family:var(--display)}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:22px;border-top:2px dashed var(--tinta);padding-top:8px;font-variant-numeric:tabular-nums}
.nota-in{width:100%;border:2px solid var(--tinta);border-radius:10px;padding:8px 10px;font-size:16px;background:#fff}
.pago-op{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pago-op button{display:grid;gap:4px;place-items:center;padding:14px 8px;border:2.5px solid var(--tinta);border-radius:14px;background:#fff;font-size:18px;box-shadow:3px 3px 0 var(--tinta)}
.pago-op button svg{width:34px;height:34px}
.pago-op button[aria-pressed="true"]{background:var(--amarillo)}

/* ============ PERSONAL (camarero, panel) ============ */
.staff{font-family:var(--ui);font-size:15px;background:#f6f1e6}
.staff body{background:#f6f1e6}
.app-cam{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#f6f1e6;font-family:var(--ui)}
.c-cab{position:sticky;top:0;z-index:20;background:var(--tinta);color:var(--papel);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:grid;gap:8px}
.c-fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.c-cab h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.03em;color:var(--papel)}
.c-cab h1 span{color:var(--amarillo)}
.c-sel{background:#2d2822;border:1.5px solid #5a5048;color:var(--papel);border-radius:10px;padding:6px 8px;font-weight:700;font-size:14px}
.sonido{display:inline-flex;align-items:center;gap:6px;background:#2d2822;border:1.5px solid #5a5048;color:var(--papel);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.sonido[aria-pressed="true"]{background:var(--amarillo);color:var(--tinta);border-color:var(--amarillo)}
.seg{display:flex;background:#2d2822;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:#d8cfbf;border-radius:9px;padding:8px;font-weight:800;font-size:14px;position:relative}
.seg button[aria-pressed="true"]{background:var(--papel);color:var(--tinta)}
.seg .b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--rojo);color:#fff;font-size:12px;margin-left:5px;padding:0 5px}
.c-cuerpo{padding:12px;display:grid;gap:10px;align-content:start;flex:1}
.aviso{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px;background:#fff;border-radius:14px;border:1.5px solid #e2d8c6;border-left:8px solid var(--azul);box-shadow:0 2px 0 rgba(31,27,23,.06)}
.aviso.llamada{border-left-color:var(--azul)}
.aviso.cuenta{border-left-color:var(--amarillo)}
.aviso.pedido{border-left-color:var(--ok)}
.aviso.listo{border-left-color:var(--rojo)}
.aviso.escalado{background:#fff1ef;border-color:#f0b9b4;animation:latido 1.4s infinite}
@keyframes latido{50%{box-shadow:0 0 0 5px rgba(196,32,42,.18)}}
.aviso .m{grid-row:span 2;width:52px;height:52px;border-radius:12px;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-family:var(--display);font-size:24px;line-height:1;padding-top:3px}
.aviso .q{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.aviso .det{font-size:14px;color:var(--tinta-2);grid-column:2}
.aviso .acc{grid-row:1 / span 2;grid-column:3}
.aviso .pie{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--tinta-3);border-top:1px dashed #e2d8c6;padding-top:8px;margin-top:6px}
.reloj{font-variant-numeric:tabular-nums;font-weight:700}
.reloj.am{color:var(--aviso)}.reloj.ro{color:var(--critico)}
.chip-esc{font-size:12px;font-weight:800;background:var(--critico);color:#fff;border-radius:999px;padding:2px 8px}
.b-ui{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;min-height:44px;background:var(--tinta);color:var(--papel)}
.b-ui.rojo{background:var(--rojo);color:#fff}
.b-ui.verde{background:var(--ok);color:#fff}
.b-ui.claro{background:#fff;color:var(--tinta);border:1.5px solid #d6cbb6}
.b-ui.amar{background:var(--amarillo);color:var(--tinta)}
.b-ui[disabled]{opacity:.45}
.zona-t{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);margin:8px 2px 2px}
.g-mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mesa-b{border:1.5px solid #d6cbb6;background:#fff;border-radius:12px;padding:8px 6px;text-align:center;display:grid;gap:2px;border-top:5px solid #d6cbb6;min-height:74px;align-content:center}
.mesa-b b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.mesa-b small{font-size:12px;color:var(--tinta-3);line-height:1.2}
.mesa-b.abierta{border-top-color:var(--ok);background:#f4faf2}
.mesa-b.cocina{border-top-color:var(--aviso);background:#fff8ea}
.mesa-b.cuenta{border-top-color:var(--azul);background:#eef5fb}
.mesa-b.alerta{border-top-color:var(--critico);background:#fff1ef}
.mesa-b.ajena{opacity:.5}
.panel-hoja h3{font-family:var(--display);font-weight:400;font-size:24px;color:var(--rojo);margin:0}
.hoja.ui{font-family:var(--ui);font-size:15px}
.hoja.ui .lin{font-size:15px}
.hoja.ui .total{font-size:20px}

/* ============ COCINA / BARRA ============ */
.kds{min-height:100vh;min-height:100dvh;background:#1d1a17;color:#f3ead4;font-family:var(--ui);display:flex;flex-direction:column}
.k-cab{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 18px;background:#141210;border-bottom:1px solid #3a342e}
.k-cab h1{margin:0;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.04em;color:var(--papel)}
.k-cab h1 span{color:var(--amarillo)}
.k-cab .hora{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}
.k-res{display:flex;gap:8px;flex-wrap:wrap}
.k-res .pill{color:#e8dcc4;border-color:#5a5048}
.k-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;min-height:0}
@media (max-width:720px){.k-cols{grid-template-columns:1fr}}
.k-col{background:#2a2521;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:200px}
.k-col h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#cfc4b1;display:flex;justify-content:space-between}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ticket{background:#fffcf3;color:var(--tinta);border-radius:12px;padding:12px;display:grid;gap:8px;border-top:10px solid var(--ok);animation:entra .3s ease-out}
@keyframes entra{from{transform:scale(.96);opacity:.4}}
.ticket.am{border-top-color:var(--amarillo)}
.ticket.ro{border-top-color:var(--critico)}
.ticket.nuevo-flash{box-shadow:0 0 0 4px var(--amarillo)}
.ticket .tc{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ticket .tc b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.ticket .tc .reloj{font-size:20px}
.ticket ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:20px;font-weight:700}
.ticket li .q{display:inline-block;min-width:34px;font-family:var(--display);font-weight:400;color:var(--rojo)}
.ticket .nota{font-size:15px;background:#fff2c9;border-radius:8px;padding:6px 8px;font-weight:700}
.ticket .meta{font-size:13px;color:var(--tinta-3)}
.ticket .b-ui{width:100%;font-size:17px;min-height:52px}

/* ============ PANEL ============ */
.panel{display:grid;grid-template-columns:230px 1fr;min-height:100vh;font-family:var(--ui);background:#f6f1e6}
.p-side{background:var(--tinta);color:var(--papel);padding:18px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}
.p-side .marca b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--rojo);letter-spacing:.02em;line-height:1;text-shadow:2px 2px 0 #000}
.p-side .marca span{font-family:var(--nota);font-size:20px;color:#cfc4b1}
.p-side nav{display:grid;gap:4px}
.p-side nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--papel);font-size:15px;font-weight:700;text-align:left}
.p-side nav button svg{width:19px;height:19px}
.p-side nav button[aria-current="page"]{background:var(--rojo);color:#fff}
.p-side nav button:hover:not([aria-current="page"]){background:rgba(255,255,255,.07)}
.p-side .abajo{margin-top:auto;display:grid;gap:8px;font-size:13px;color:#cfc4b1}
.p-side .abajo a{color:#cfc4b1}
@media (max-width:900px){
  .panel{grid-template-columns:1fr}
  .p-side{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:10px;z-index:30}
  .p-side nav{display:flex;overflow-x:auto;gap:4px;flex:1 1 100%}
  .p-side nav button{white-space:nowrap;padding:7px 10px}
  .p-side .abajo{display:none}
}
.p-main{padding:22px clamp(14px,3vw,32px) 40px;min-width:0}
.p-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.p-cab h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,38px);margin:0;color:var(--rojo);letter-spacing:.02em;line-height:1}
.p-cab p{margin:6px 0 0;color:var(--tinta-2)}
.card{background:#fff;border:1.5px solid #e2d8c6;border-radius:16px;padding:16px;min-width:0;box-shadow:0 2px 0 rgba(31,27,23,.05)}
.card h2{margin:0 0 2px;font-size:17px;font-weight:800}
.card .ayuda{margin:0 0 12px;font-size:14px;color:var(--tinta-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi small{display:block;font-size:13px;font-weight:700;color:var(--tinta-3);text-transform:uppercase;letter-spacing:.05em}
.kpi strong{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .d{font-size:13px;color:var(--tinta-3)}
.rej{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
@media (max-width:1100px){.c8,.c4,.c6{grid-column:span 12}}
.graf{position:relative}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf text{font-family:var(--ui);fill:var(--tinta-3);font-size:12px}
.graf .val{fill:var(--tinta);font-weight:700}
.graf:hover .barra{opacity:.55}
.graf .barra{transition:opacity .15s}
.graf .barra:hover{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--tinta);color:var(--papel);padding:5px 9px;border-radius:8px;font-size:13px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));z-index:5;display:none}
.sala{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sala .mesa-b{min-height:92px;cursor:pointer}
.sala .mesa-b .cam{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.ley-sala{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--tinta-2);margin-bottom:12px}
.ley-sala i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabla-wrap{overflow-x:auto;border:1.5px solid #e2d8c6;border-radius:14px;background:#fff}
table.datos{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
table.datos th{font-weight:800;text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);padding:10px 12px;border-bottom:1.5px solid #e2d8c6;background:#faf6ee}
table.datos td{padding:8px 12px;border-bottom:1px solid #f0e8d8;vertical-align:middle}
table.datos tr.sec td{background:#faf6ee;font-family:var(--display);font-size:15px;color:var(--rojo-osc);letter-spacing:.03em}
table.datos tr.agot td:not(:last-child){opacity:.5}
.campo{border:1.5px solid #cfc3ad;border-radius:10px;background:#fff;padding:8px 11px;font-size:15px}
.precio-in{width:92px;text-align:right;font-variant-numeric:tabular-nums}
.interr{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700}
.interr input{position:absolute;opacity:0;width:1px;height:1px}
.interr .pista{width:44px;height:24px;border-radius:999px;background:#d8ccb4;position:relative;transition:background .15s;flex:none}
.interr .pista::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.interr input:checked+.pista{background:var(--ok)}
.interr input:checked+.pista::after{left:23px}
.interr input:focus-visible+.pista{outline:3px dashed var(--rojo);outline-offset:2px}
.seg-claro{display:inline-flex;border:1.5px solid #cfc3ad;border-radius:12px;overflow:hidden;background:#fff}
.seg-claro button{border:0;background:none;padding:7px 14px;font-weight:800;font-size:14px}
.seg-claro button+button{border-left:1.5px solid #cfc3ad}
.seg-claro button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.alertas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alertas li{display:grid;gap:2px;padding:9px 11px;border:1px solid #eadfcb;border-radius:10px;border-left:5px solid var(--aviso);font-size:14px}
.alertas li.critico{border-left-color:var(--critico)}.alertas li.ok{border-left-color:var(--ok)}
.alertas .h{font-size:12px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.nfc-lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.nfc-lista li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:1.5px solid #e2d8c6;border-radius:12px;padding:8px 10px}
.nfc-lista b{font-family:var(--display);font-weight:400;font-size:20px;width:34px;text-align:center}
.nfc-lista code{font-size:12px;color:var(--tinta-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.camareros{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.cam-c{display:grid;gap:8px}
.cam-c .nom{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800}
.cam-c .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}
.plano{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.plano .m{border:1.5px solid #e2d8c6;border-radius:10px;padding:7px 8px;display:grid;gap:4px;background:#fff;border-top-width:6px}
.plano .m b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1}
.plano select{border:1.5px solid #cfc3ad;border-radius:8px;padding:3px 4px;font-size:13px;width:100%;background:#faf6ee}
.vacio-ui{padding:22px;text-align:center;color:var(--tinta-3);font-size:15px;border:2px dashed #e2d8c6;border-radius:14px;background:#fffdf8}

/* ============ NUEVO: idiomas, menú del día, sugerencias, valoración, llevar, recogida ============ */
.idioma{display:inline-flex;border:2px solid var(--tinta);border-radius:999px;overflow:hidden;background:#fff;flex:none}
.idioma button{border:0;background:none;padding:4px 9px;font-family:var(--ui);font-size:12px;font-weight:800;min-height:30px}
.idioma button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.carta .idioma{position:absolute;right:0;top:14px}
.menu-dia{position:relative;margin:18px 0 6px;background:#fff;border:3px solid var(--tinta);border-radius:18px;padding:16px 18px;box-shadow:5px 5px 0 var(--rojo)}
.menu-dia .cinta{position:absolute;top:-14px;left:16px;background:var(--rojo);color:#fff;font-family:var(--display);font-size:16px;letter-spacing:.04em;padding:4px 12px 2px;border:2px solid var(--tinta);border-radius:8px;transform:rotate(-2deg)}
.menu-dia h2{margin:6px 0 2px;font-family:var(--display);font-weight:400;font-size:28px;color:var(--rojo);letter-spacing:.02em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.menu-dia h2 .pz{color:var(--tinta);background:var(--amarillo);padding:2px 10px 0;border-radius:8px;border:2px solid var(--tinta)}
.menu-dia .cuando{font-family:var(--nota);font-size:21px;color:var(--tinta-2);margin:0}
.menu-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media (max-width:640px){.menu-cols{grid-template-columns:1fr}}
.menu-cols h3{margin:0 0 4px;font-family:var(--nota);font-size:22px;color:var(--rojo-osc)}
.menu-cols ul{margin:0;padding-left:18px;font-size:17px}
.menu-dia .incl{margin:10px 0 0;font-size:15px;color:var(--tinta-2);border-top:2px dashed var(--linea);padding-top:8px}
.menu-mesa{background:#fff;border:2.5px solid var(--tinta);border-radius:16px;padding:12px;box-shadow:3px 3px 0 var(--rojo);display:grid;gap:6px}
.menu-mesa b{font-family:var(--display);font-weight:400;color:var(--rojo);font-size:20px;letter-spacing:.02em}
.elige{display:grid;gap:6px}
.elige h4{margin:6px 0 0;font-family:var(--nota);font-size:22px;color:var(--rojo-osc)}
.elige .ops{display:flex;flex-wrap:wrap;gap:6px}
.elige .ops button{border:2px solid var(--tinta);background:#fff;border-radius:999px 30px 999px 40px;padding:6px 12px;font-size:16px;min-height:38px}
.elige .ops button[aria-pressed="true"]{background:var(--amarillo)}
.sugs{background:#fff7dc;border:2px dashed var(--tinta);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.sugs h4{margin:0;font-family:var(--nota);font-size:23px}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px}
.sug .pr{font-family:var(--display);color:var(--rojo);font-size:16px;margin-left:6px}
.estrellas{display:flex;gap:6px;justify-content:center}
.estrellas button{background:none;border:0;padding:2px;min-width:48px;min-height:48px}
.estrellas svg{width:42px;height:42px;fill:#efe5cf;stroke:var(--tinta);stroke-width:1.6}
.estrellas button[aria-pressed="true"] svg{fill:var(--amarillo)}
.google-cta{display:grid;gap:8px;text-align:center;background:#fff;border:2.5px solid var(--tinta);border-radius:16px;padding:14px}
.codigo{font-family:var(--display);font-size:64px;line-height:1;color:var(--rojo);text-align:center;letter-spacing:.04em;text-shadow:3px 3px 0 var(--tinta)}
.form-ll{display:grid;gap:10px}
.form-ll label{display:grid;gap:4px;font-size:16px}
.form-ll input,.form-ll select{border:2px solid var(--tinta);border-radius:10px;padding:9px 11px;font-size:17px;background:#fff}
.recogida{min-height:100vh;min-height:100dvh;background:var(--papel);display:grid;grid-template-rows:auto 1fr auto;font-family:var(--ui)}
.r-cab{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 26px;background:var(--tinta);color:var(--papel)}
.r-cab img{height:58px;width:auto;background:var(--papel);border-radius:12px;padding:4px 10px}
.r-cab h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,40px);letter-spacing:.03em}
.r-cols{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;padding:22px}
@media (max-width:760px){.r-cols{grid-template-columns:1fr}}
.r-col{background:#fff;border:3px solid var(--tinta);border-radius:20px;padding:18px;box-shadow:5px 5px 0 var(--tinta)}
.r-col.listo{background:#f1f8ee;border-color:var(--ok);box-shadow:5px 5px 0 var(--ok)}
.r-col h2{margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:clamp(24px,2.8vw,34px);letter-spacing:.03em}
.r-codes{display:flex;flex-wrap:wrap;gap:12px}
.r-codes span{font-family:var(--display);font-size:clamp(34px,5vw,64px);line-height:1;padding:12px 18px 6px;border-radius:14px;background:var(--papel-2);border:2.5px solid var(--tinta)}
.r-col.listo .r-codes span{background:var(--ok);color:#fff;border-color:#1d5a20;animation:latido 1.6s infinite}
.r-codes small{display:block;font-family:var(--ui);font-size:14px;font-weight:700;margin-top:4px;opacity:.85}
.r-pie{padding:12px 26px;font-size:15px;color:var(--tinta-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.aviso .m.ll{font-size:15px;background:var(--rojo)}
.informe{width:100%;min-height:340px;border:1.5px solid #cfc3ad;border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;background:#fffdf8;resize:vertical}
.form-aj{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form-aj label{display:grid;gap:4px;font-size:13px;font-weight:800;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em}
.form-aj input,.form-aj textarea,.form-aj select{border:1.5px solid #cfc3ad;border-radius:10px;padding:8px 10px;font-size:15px;background:#fff;font-weight:400;text-transform:none;letter-spacing:0;color:var(--tinta);font-family:var(--ui)}
.form-aj textarea{min-height:120px;resize:vertical}
.cam-edit{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.cam-edit input[type=color]{width:40px;height:36px;padding:2px;border-radius:8px}
.opiniones{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opiniones li{border:1px solid #eadfcb;border-radius:10px;padding:8px 10px;font-size:14px;display:grid;gap:2px}
.opiniones .st{color:#c58a00;letter-spacing:2px}
.al-sel{display:flex;flex-wrap:wrap;gap:6px}
.al-sel label{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1.5px solid #cfc3ad;border-radius:999px;padding:3px 9px;background:#fff;cursor:pointer}
.al-sel input{accent-color:var(--rojo)}
</style>

const COLS = ["mesas","pedidos","tickets","avisos","cuentas","config","valoraciones"];
const Store = {
  modo:"local", data:Object.fromEntries(COLS.map(c=>[c,new Map()])), oyentes:new Set(), db:null, colas:new Map(),
  on(fn){ this.oyentes.add(fn); },
  emit(){ this.oyentes.forEach(f=>{ try{f();}catch(e){console.error(e);} }); },
  get(c,id){ return this.data[c].get(String(id)); },
  all(c){ return [...this.data[c].values()]; },
  async set(c,id,obj){
    id=String(id); const limpio=JSON.parse(JSON.stringify(obj));
    this.data[c].set(id,limpio); this.emit();
    if(this.modo==="db"){ const k=c+"/"+id, prev=this.colas.get(k)||Promise.resolve(); const p=prev.then(()=>this.db.collection(c).doc(id).set(limpio)).catch(e=>this.fallo(e)); this.colas.set(k,p); return p; }
    if(this.modo==="supa"){ const k=c+"/"+id, prev=this.colas.get(k)||Promise.resolve(); const p=prev.then(async()=>{ const {error}=await this.sb.from("docs").upsert({col:c,id,data:limpio,updated_at:new Date().toISOString()}); if(error) throw error; }).catch(e=>this.fallo(e)); this.colas.set(k,p); return p; }
    Local.volcar();
  },
  async del(c,id){
    id=String(id); this.data[c].delete(id); this.emit();
    if(this.modo==="db"){ const k=c+"/"+id, prev=this.colas.get(k)||Promise.resolve(); const p=prev.then(()=>this.db.collection(c).doc(id).delete()).catch(e=>this.fallo(e)); this.colas.set(k,p); return p; }
    if(this.modo==="supa"){ const k=c+"/"+id, prev=this.colas.get(k)||Promise.resolve(); const p=prev.then(async()=>{ const {error}=await this.sb.from("docs").delete().eq("col",c).eq("id",id); if(error) throw error; }).catch(e=>this.fallo(e)); this.colas.set(k,p); return p; }
    Local.volcar();
  },
  fallo(e){
    console.warn("db",e);
    if(e && e.code==="invalid_argument") toast("Solo puedes ver: tu cuenta no tiene permiso para cambiar datos.");
    else if(e && e.code==="quota_exceeded") toast("La base de datos está llena. Usa «Cerrar el día» en el panel para limpiar.");
    else toast("No se ha podido guardar. Revisa la conexión e inténtalo otra vez.");
  }
};

async function conectarSupabase(){
  if(!window.supabase || SUPA_URL.startsWith("__")) return false;
  const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});
  Store.sb=sb;
  const cargar=async()=>{ const m=Object.fromEntries(COLS.map(c=>[c,new Map()])); let desde=0;
    while(true){ const {data,error}=await sb.from("docs").select("col,id,data").range(desde,desde+999); if(error) throw error;
      data.forEach(r=>{ if(m[r.col]) m[r.col].set(r.id,r.data); }); if(data.length<1000) break; desde+=1000; }
    COLS.forEach(c=>Store.data[c]=m[c]); Store.emit(); };
  try{ await cargar(); }catch(e){ console.warn("supabase",e); toast("No se ha podido conectar con la base de datos. Funcionando en modo local."); return false; }
  Store.modo="supa"; Store.emit();
  sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    if(p.eventType==="DELETE"){ const o=p.old||{}; if(o.col && Store.data[o.col]){ Store.data[o.col].delete(o.id); Store.emit(); } return; }
    const r=p.new; if(r && Store.data[r.col]){ Store.data[r.col].set(r.id,r.data); Store.emit(); }
  }).subscribe(st=>{ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") toast("Conexión en vivo interrumpida. Reintentando…"); if(st==="SUBSCRIBED" && Store._resync){ cargar().catch(()=>{}); } Store._resync=true; });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") cargar().catch(()=>{}); });
  return true;
}
async function conectarDB(){
  if(await conectarSupabase()) return;
  if(!window.claude || typeof window.claude.use!=="function") return;
  let db=null; try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db) return;
  Store.db=db; Store.modo="db"; COLS.forEach(c=>Store.data[c]=new Map());
  let pend=COLS.length; const timer=setTimeout(()=>{ if(pend>0) toast("Conectando con el bar… los datos pueden tardar un poco."); },10000);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,d.data()); }); Store.data[c]=m;
      if(!snap.metadata.fromCache && pend>0){ pend--; if(!pend) clearTimeout(timer); }
      Store.emit();
    }, err=>{ console.warn("snapshot",c,err); if(err && err.code!=="unavailable") toast("Se ha perdido la conexión en vivo. Recarga la página para volver a conectar."); });
  });
  Store.emit();
}

    const dias=[...(hist.dias||[]),{fecha:new Date().toISOString().slice(0,10),fact:r.fact,pedidos:r.pedidos.length,resp:r.respMedia,cuentas:r.cuentas.length,nota:r.notaMedia}].slice(-90);

// Números de un periodo (dias=0 → hoy; dias=6 → últimos 7 días)
function resumen(dias=0){
  const t0=inicioDia(dias);
  const pedidos=Store.all("pedidos").filter(p=>p.t>=t0);
  const cuentas=Store.all("cuentas").filter(c=>c.t>=t0);
  const abiertas=Store.all("mesas").filter(m=>m.abierta);
  const fact=cuentas.reduce((a,c)=>a+c.total,0);
  const resp=Store.all("avisos").filter(a=>a.t>=t0 && !a.info && a.atendido && !a.atendido.auto && a.tipo!=="listo").map(a=>({ms:a.atendido.t-a.t,por:a.atendido.por}));
  const respMedia=resp.length?resp.reduce((a,b)=>a+b.ms,0)/resp.length:null;
  const tks=Store.all("tickets").filter(k=>k.t>=t0 && k.listoT);
  const cocinaMedia=tks.length?tks.reduce((a,k)=>a+(k.listoT-k.t),0)/tks.length:null;
  const esc=Store.all("avisos").filter(a=>a.t>=t0 && !a.info && ((a.atendido?a.atendido.t:ahora())-a.t)/1000>=cfgTurno().escala);
  const horas=Array(12).fill(0); pedidos.forEach(p=>{ const h=new Date(p.t).getHours(); if(h>=12&&h<=23) horas[h-12]++; });
  const unidades={}; pedidos.forEach(p=>p.items.forEach(x=>{ const nm=x.id.startsWith("menu~")?"Menú del día":x.n; unidades[nm]=(unidades[nm]||0)+x.q; }));
  const porCam={}; resp.forEach(r=>{ (porCam[r.por]=porCam[r.por]||[]).push(r.ms); });
  const pago={tarjeta:0,efectivo:0}; cuentas.forEach(c=>{ if(c.forma in pago) pago[c.forma]++; });
  let sugU=0, sugE=0; pedidos.forEach(p=>p.items.forEach(x=>{ if(x.sug){ sugU+=x.q; sugE+=x.q*x.p; } }));
  const vals=Store.all("valoraciones").filter(v=>v.t>=t0);
  const notaMedia=vals.length?vals.reduce((a,v)=>a+v.estrellas,0)/vals.length:null;
  const llevar=pedidos.filter(p=>p.llevar);
  const menus=pedidos.reduce((a,p)=>a+p.items.filter(x=>x.id.startsWith("menu~")).reduce((s,x)=>s+x.q,0),0);
  return {pedidos,cuentas,abiertas,fact,respMedia,cocinaMedia,esc,horas,unidades,porCam,pago,sugU,sugE,vals,notaMedia,llevar,menus,
    pendientes:avisosAbiertos().filter(a=>!a.info).length};
}

function ruta(){
  const h=(location.hash||"#inicio").slice(1); let m;
  if(h==="carta") return {v:"carta"};
  if((m=h.match(/^mesa-(\d{1,2})$/)) && +m[1]>=1 && +m[1]<=mesasN()) return {v:"mesa",n:+m[1]};
  if(h==="llevar") return {v:"llevar"};
  if((m=h.match(/^pedido-([a-z0-9]+)$/))) return {v:"seguir",id:m[1]};
  if(h==="recogida") return {v:"recogida"};
  if(h==="camarero") return {v:"camarero"};
  if(h==="cocina"||h==="barra") return {v:"kds",dest:h};
  if(h==="panel") return {v:"panel"};
  return {v:"inicio"};
}

// Gestiona clics comunes del carrito; devuelve true si lo ha atendido
function clicCarrito(t, st){
  const b3=t.closest("[data-3d]"); if(b3){ abrir3D(b3.dataset["3d"]); return true; }
  const c=t.closest("[data-cat]"); if(c){ st.cat=c.dataset.cat; return "pintar"; }
  const mas=t.closest("[data-mas]"); if(mas){ st.carrito[mas.dataset.mas]=(st.carrito[mas.dataset.mas]||0)+1; try{navigator.vibrate&&navigator.vibrate(15);}catch(_){} st.bump=1; return "pintar"; }
  const sg=t.closest("[data-sug]"); if(sg){ st.carrito[sg.dataset.sug]=(st.carrito[sg.dataset.sug]||0)+1; st.sugs.add(sg.dataset.sug); return "pintar"; }
  const menos=t.closest("[data-menos]"); if(menos){ const k=menos.dataset.menos; st.carrito[k]--; if(!st.carrito[k]) delete st.carrito[k]; return "pintar"; }
  if(t.closest("[data-elegir-menu]")){ st.hoja="menu"; st.msel={}; return "pintar"; }
  const ms=t.closest("[data-msel]"); if(ms){ st.msel[ms.dataset.msel]=+ms.dataset.i; return "pintar"; }
  if(t.closest("[data-add-menu]")){ const k=`menu~${st.msel.a}~${st.msel.b}~${st.msel.c}`; st.carrito[k]=(st.carrito[k]||0)+1; st.hoja=null; st.cat="menu"; return "pintar"; }
  return false;
}

  const tk=k=>{ const min=(ahora()-k.t)/60000; return `<div class="ticket ${min>=10?"ro":min>=5?"am":""}" data-tk="${k.id}">
    <div class="tc"><b>${k.llevar?`${ico("bag")} ${esc(k.codigo)}`:`Mesa ${k.mesa}`}</b><span class="reloj" data-desde="${k.t}">${mmss(ahora()-k.t)}</span></div>
    ${k.llevar?`<div class="nota" style="background:#ffe1e1">Para llevar · ${esc(k.nombre)} · recoge ${esc(k.hora)}</div>`:""}
    <ul>${k.items.map(x=>`<li><span class="q">${x.q}×</span>${esc(x.n)}</li>`).join("")}</ul>${k.nota?`<div class="nota">Nota: ${esc(k.nota)}</div>`:""}
    <div class="meta">${k.llevar?"Barra":zonaDe(k.mesa)+" · "+esc(nomCam(camDe(k.mesa)))}${k.inicioT?` · empezado hace ${mmss(ahora()-k.inicioT)}`:""}</div>
    ${k.estado==="nuevo"?`<button class="b-ui amar" data-emp="${k.id}">Empezar</button>`:`<button class="b-ui verde" data-listo="${k.id}">${ico("check")}¡Listo!</button>`}</div>`; };
  function pintar(){
    const ts=tks(), nu=ts.filter(k=>k.estado==="nuevo"), pr=ts.filter(k=>k.estado!=="nuevo");
    const hechos=Store.all("tickets").filter(k=>k.dest===dest&&k.listoT&&k.t>=inicioDia()), media=hechos.length?hechos.reduce((a,k)=>a+(k.listoT-k.t),0)/hechos.length:null;
    app.innerHTML=`<div class="kds"><div class="k-cab"><h1>${dest==="cocina"?"COCINA":"BARRA"} <span>· ${esc(cfgBar().nombre.replace(/^Bar /,""))}</span></h1>
      <div class="k-res"><span class="pill">${ts.length} en marcha</span><span class="pill">${hechos.length} hechos hoy</span>${media?`<span class="pill">media ${mmss(media)}</span>`:""}</div>
      <div style="display:flex;gap:10px;align-items:center">${modoBadge()}<button class="sonido" data-sonido aria-pressed="${sonidoOn()}">${ico("speaker")}${sonidoOn()?"Sonido":"Sin sonido"}</button><span class="hora" id="hora">${hhmm(ahora())}</span></div></div>
      <div class="k-cols"><section class="k-col"><h2><span>Nuevos</span><span>${nu.length}</span></h2>${nu.length?`<div class="k-grid">${nu.map(tk).join("")}</div>`:`<p class="vacio" style="color:#8f8577">Nada nuevo</p>`}</section>
      <section class="k-col"><h2><span>Preparando</span><span>${pr.length}</span></h2>${pr.length?`<div class="k-grid">${pr.map(tk).join("")}</div>`:`<p class="vacio" style="color:#8f8577">Nada en marcha</p>`}</section></div></div>`;
  }
  async function clic(e){
    activarAudio();
    if(e.target.closest("[data-sonido]")){ try{ localStorage.setItem("lp-sonido",sonidoOn()?"0":"1"); }catch(_){} if(sonidoOn()) pitido("cocina"); return pintar(); }
    const em=e.target.closest("[data-emp]"); if(em) return Acc.ticket(em.dataset.emp,"preparando");
    const li=e.target.closest("[data-listo]"); if(li){ const k=Store.get("tickets",li.dataset.listo); await Acc.ticket(li.dataset.listo,"listo"); toast(`${lugar(k)} listo. Avisado ${k.llevar?"en barra":nomCam(camDe(k.mesa))}.`); }
  }
  app.addEventListener("click",clic);
  return { titulo:(dest==="cocina"?"Cocina":"Barra")+" · "+cfgBar().nombre, pintar,
    alCambiar(){ const ids=new Set(tks().map(k=>k.id)); if(vistos && [...ids].some(i=>!vistos.has(i))) pitido("cocina"); vistos=ids; pintar(); },
    tic(){ const h=document.getElementById("hora"); if(h) h.textContent=hhmm(ahora()); app.querySelectorAll(".ticket").forEach(el=>{ const k=Store.get("tickets",el.dataset.tk); if(!k) return; const m=(ahora()-k.t)/60000; el.classList.toggle("am",m>=5&&m<10); el.classList.toggle("ro",m>=10); }); },
    salir(){ app.removeEventListener("click",clic); } };
}

      <div class="seg-claro" role="group"><button data-inf="1" aria-pressed="${periodoInf===1}">Hoy</button><button data-inf="7" aria-pressed="${periodoInf===7}">7 días</button><button data-inf="30" aria-pressed="${periodoInf===30}">30 días</button></div></div>
      <div class="rej"><div class="card c8"><textarea class="informe" id="inf" readonly aria-label="Texto del informe">${esc(txt)}</textarea></div>
      <div class="card c4"><h2>Enviar</h2><p class="ayuda">${tel?`Al ${esc(bar.telefono)} (cámbialo en Ajustes del bar).`:"Pon el móvil del dueño en Ajustes del bar para enviárselo directo."}</p>
        <div style="display:grid;gap:8px"><a class="b-ui verde" href="${wa}">${ico("chat")}Enviar por WhatsApp</a>
        <a class="b-ui claro" href="mailto:${esc(bar.email||"")}?subject=${encodeURIComponent("Informe "+bar.nombre)}&body=${encodeURIComponent(txt)}">${ico("mail")}Abrir en el correo</a>
        <button class="b-ui claro" data-copiar-inf>${ico("copy")}Copiar el texto</button></div>
        <p class="ayuda" style="margin-top:12px">Si el correo no se abre desde aquí, usa «Copiar el texto».</p></div></div>`;
  }
  function cartaV(){
    const q=norm(buscar);
    return `<div class="p-cab"><div><h1>Carta</h1><p>Lo que cambies sale al momento en la carta web, en las mesas y en para llevar.</p></div><input class="campo" id="bc" type="search" placeholder="Buscar plato…" value="${esc(buscar)}" aria-label="Buscar plato"></div>
      <div class="tabla-wrap"><table class="datos"><thead><tr><th>Plato</th><th>Va a</th><th style="text-align:right">Precio</th><th>Alérgenos</th><th>3D</th><th>Disponible hoy</th></tr></thead><tbody>
      ${SECCIONES.map(s=>{ const ps=carta().filter(p=>p.sec===s.id&&(!q||norm(p.n).includes(q))); if(!ps.length) return "";
        return `<tr class="sec"><td colspan="6">${sT(s,1)}</td></tr>`+ps.map(p=>`<tr class="${agotado(p.id)?"agot":""}"><td><b>${esc(p.n)}</b>${p.extra?` <span class="pill" style="font-size:11px">nuevo</span> <button class="b-ui claro" style="min-height:28px;padding:2px 8px;font-size:12px" data-quitar-plato="${p.id}">Quitar</button>`:""}</td><td>${p.dest==="cocina"?"Cocina":"Barra"}</td>
          <td style="text-align:right;white-space:nowrap"><input class="campo precio-in" type="number" min="0" step="0.1" value="${precio(p.id)}" data-precio="${p.id}" aria-label="Precio de ${esc(p.n)}"> €</td>
          <td style="font-size:13px">${p.a.length?p.a.map(k=>ALERGENOS[k].n).join(", "):"—"}</td><td>${p.modelo?`<span class="pill ok">${ico("check")} Escaneado</span>`:`<span style="font-size:13px;color:var(--tinta-3)">Pendiente</span>`}</td>
          <td><label class="interr"><input type="checkbox" data-disp="${p.id}" ${agotado(p.id)?"":"checked"}><span class="pista"></span>${agotado(p.id)?"Agotado":"Sí"}</label></td></tr>`).join(""); }).join("")}
      </tbody></table></div>
      <div class="card" style="margin-top:14px"><h2>Añadir plato</h2><p class="ayuda">Aparece al momento en la carta y en las mesas (en español; en otros idiomas sale igual).</p>
        <form class="form-aj" id="f-plato"><label>Nombre<input id="np-n" required maxlength="60"></label><label>Descripción<input id="np-d" maxlength="120"></label>
        <label>Sección<select id="np-s">${SECCIONES.map(s=>`<option value="${s.id}">${sT(s,0)}</option>`).join("")}</select></label><label>Precio (€)<input id="np-p" type="number" min="0" step="0.1" required></label>
        <div style="grid-column:1/-1;display:grid;gap:6px"><span style="font-size:13px;font-weight:800;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em">Alérgenos</span><div class="al-sel">${Object.entries(ALERGENOS).map(([k,a])=>`<label><input type="checkbox" value="${k}">${a.n}</label>`).join("")}</div></div>
        <div><button class="b-ui rojo" type="submit">Añadir a la carta</button></div></form></div>`;
  }
  function menuV(){
    const m=cfgMenu();
    return `<div class="p-cab"><div><h1>Menú del día</h1><p>Cámbialo cada mañana: sale arriba en la carta web y como primera sección en las mesas.</p></div>
      <label class="interr"><input type="checkbox" id="mn-activo" ${m.activo?"checked":""}><span class="pista"></span>${m.activo?"Se está mostrando":"Oculto"}</label></div>
      <div class="card"><form class="form-aj" id="f-menu">
        <label>Precio (€)<input id="mn-precio" type="number" min="0" step="0.5" value="${m.precio}"></label>
        <label>Cuándo<input id="mn-cuando" value="${esc(m.cuando)}" maxlength="60"></label>
        <label style="grid-column:1/-1">Incluye<input id="mn-incluye" value="${esc(m.incluye)}" maxlength="140"></label>
        <label>Primeros (uno por línea)<textarea id="mn-1">${esc(m.primeros.join("\n"))}</textarea></label>
        <label>Segundos (uno por línea)<textarea id="mn-2">${esc(m.segundos.join("\n"))}</textarea></label>
        <label>Postres (uno por línea)<textarea id="mn-3">${esc(m.postres.join("\n"))}</textarea></label>
        <div style="grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap"><button class="b-ui rojo" type="submit">${ico("check")}Publicar menú de hoy</button><a class="b-ui claro" href="#carta">Ver cómo queda en la carta</a></div>
      </form></div>`;
  }
  function turnoV(){
    const t=cfgTurno(), N=mesasN();
    return `<div class="p-cab"><div><h1>Turno y mesas</h1><p>Cada camarero recibe solo los avisos de sus mesas. Los cambios llegan al momento a sus móviles.</p></div><button class="b-ui" data-repartir>Repartir mesas automáticamente</button></div>
      <div class="camareros">${cams().map(c=>{ const ms=Object.keys(t.asign).map(Number).filter(n=>t.asign[n]===c.id); const act=t.activos[c.id]!==false;
        return `<div class="card cam-c"><div class="nom"><span><i class="dot" style="background:${c.color}"></i>${esc(c.n)}</span><label class="interr"><input type="checkbox" data-activo="${c.id}" ${act?"checked":""}><span class="pista"></span>${act?"En turno":"Libra"}</label></div><span style="font-size:14px;color:var(--tinta-2)">${act?(ms.length?`${ms.length} mesas: ${resumirMesas(ms)}`:"Sin mesas"):"Hoy no trabaja"}</span></div>`; }).join("")}</div>
      <div class="card" style="margin-bottom:14px"><h2>Plano de mesas</h2><p class="ayuda">El color de arriba es el de su camarero.</p>
        ${["Interior","Terraza"].map(z=>{ const ns=Array.from({length:N},(_,i)=>i+1).filter(n=>zonaDe(n)===z); if(!ns.length) return ""; return `<p class="zona-t">${z}</p><div class="plano">${ns.map(n=>{ const c=cams().find(x=>x.id===t.asign[n])||cams()[0];
          return `<div class="m" style="border-top-color:${c.color}"><b>Mesa ${n}</b><select data-asign="${n}" aria-label="Camarero de la mesa ${n}">${cams().map(x=>`<option value="${x.id}" ${x.id===t.asign[n]?"selected":""}>${esc(x.n)}</option>`).join("")}</select></div>`; }).join("")}</div>`; }).join("")}</div>
      <div class="card"><h2>Avisos sin atender</h2><p class="ayuda">Para que ninguna mesa se quede esperando.</p><label style="display:flex;flex-wrap:wrap;gap:8px;align-items:center" for="escala">Si nadie contesta en <input class="campo" id="escala" type="number" min="15" max="300" step="15" value="${t.escala}" style="width:80px;text-align:right"> segundos, el aviso salta a todos los camareros.</label></div>`;
  }
  function nfcV(){
    const base=location.href.split("#")[0], N=mesasN();
    return `<div class="p-cab"><div><h1>Tarjetas NFC</h1><p>El enlace que hay que grabar en la tarjeta de cada mesa.</p></div><button class="b-ui" data-copiar-todo>${ico("copy")}Copiar todos</button></div>
      <div class="card" style="margin-bottom:14px"><h2>Cómo grabarlas con el móvil</h2><ol style="margin:6px 0 0;padding-left:20px;line-height:1.6;max-width:75ch"><li>Instala una app para escribir NFC (por ejemplo NFC Tools).</li><li>Elige <b>Escribir → Añadir registro → URL</b> y pega el enlace de la mesa.</li><li>Acerca la tarjeta a la parte trasera del móvil hasta que confirme.</li><li>Pruébala: al acercar cualquier móvil debe abrirse la mesa correcta.</li></ol>
        <p class="ayuda" style="margin:10px 0 0">Prototipo con las tarjetas actuales: cada mesa solo admite pedidos cuando el camarero la abre.</p></div>
      <ul class="nfc-lista">${Array.from({length:N},(_,i)=>i+1).map(n=>`<li><b>${n}</b><div style="min-width:0"><code>${esc(base)}#mesa-${n}</code><span style="font-size:12px;color:var(--tinta-3)">${zonaDe(n)} · ${esc(nomCam(camDe(n)))}</span></div><span style="display:flex;gap:6px"><a class="b-ui claro" style="min-height:36px;padding:6px 10px" href="#mesa-${n}">Probar</a><button class="b-ui claro" style="min-height:36px;padding:6px 10px" data-copiar="${n}" aria-label="Copiar enlace de la mesa ${n}">${ico("copy")}</button></span></li>`).join("")}</ul>`;
  }
  function ajustesV(){
    const b=cfgBar();
    return `<div class="p-cab"><div><h1>Ajustes del bar</h1><p>Todo lo que cambia de un bar a otro. Con esto, la carta y el logo, el mismo sistema sirve para cualquier bar.</p></div></div>
      <div class="card" style="margin-bottom:14px"><form class="form-aj" id="f-bar">
        <label>Nombre del bar<input id="aj-nombre" value="${esc(b.nombre)}" maxlength="40"></label>
        <label>Ciudad<input id="aj-ciudad" value="${esc(b.ciudad)}" maxlength="40"></label>
        <label>Número de mesas<input id="aj-mesas" type="number" min="1" max="99" value="${b.mesas}"></label>
        <label>Interior hasta la mesa<input id="aj-int" type="number" min="0" max="99" value="${b.interiorHasta}"></label>
        <label style="grid-column:1/-1">Enlace de reseñas de Google<input id="aj-google" value="${esc(b.google)}"></label>
        <label>Móvil del dueño (para el informe)<input id="aj-tel" type="tel" value="${esc(b.telefono||"")}" placeholder="600 000 000"></label>
        <label>Correo del dueño<input id="aj-email" type="email" value="${esc(b.email||"")}"></label>
        <div style="grid-column:1/-1"><h2 style="margin:6px 0">Camareros</h2><div style="display:grid;gap:8px" id="aj-cams">${b.camareros.map(c=>`<div class="cam-edit" data-cid="${c.id}"><input type="color" value="${c.color}" aria-label="Color de ${esc(c.n)}"><input value="${esc(c.n)}" maxlength="20" aria-label="Nombre del camarero"><button type="button" class="b-ui claro" data-quitar-cam="${c.id}" ${b.camareros.length<2?"disabled":""}>Quitar</button></div>`).join("")}</div>
          <button type="button" class="b-ui claro" data-add-cam style="margin-top:8px">+ Añadir camarero</button></div>
        <div style="grid-column:1/-1"><button class="b-ui rojo" type="submit">${ico("check")}Guardar ajustes</button></div>
      </form></div>
      <div class="card"><h2>Llevarlo a otro bar</h2><ol style="margin:6px 0 0;padding-left:20px;line-height:1.7;max-width:80ch"><li>Cambia aquí el nombre, las mesas y los camareros.</li><li>Cambia el logo y la carta (en la versión final, desde el panel).</li><li>Graba las tarjetas NFC con los enlaces de la pestaña «Tarjetas NFC».</li><li>Al reasignar mesas o camareros, revisa «Turno y mesas».</li></ol></div>`;
  }
  function pintar(forzar){
    const ae=document.activeElement; if(!forzar && ae && app.contains(ae) && ae.matches("input:not([type=checkbox]),textarea,select")) return;
    const tabs=[["sala","Sala en vivo","live"],["resumen","Resumen","chart"],["informe","Informe","mail"],["carta","Carta","menu"],["menu","Menú del día","plate"],["turno","Turno y mesas","users"],["nfc","Tarjetas NFC","nfc"],["ajustes","Ajustes del bar","gear"]];
    const cuerpo={sala,resumen:resumenV,informe,carta:cartaV,menu:menuV,turno:turnoV,nfc:nfcV,ajustes:ajustesV}[panelTab]();
    app.innerHTML=`<div class="panel"><aside class="p-side"><div class="marca"><b>${esc(cfgBar().nombre.toUpperCase().replace(/^BAR /,""))}</b><span>panel del bar</span></div>
      <nav aria-label="Secciones del panel">${tabs.map(([k,t,i])=>`<button data-tab="${k}" aria-current="${panelTab===k?"page":"false"}">${ico(i)}${t}</button>`).join("")}</nav>
      <div class="abajo"><a href="#inicio">← Todas las pantallas</a><button class="b-ui claro" data-cerrar-dia style="font-size:13px">Cerrar el día</button><button class="b-ui claro" data-reiniciar style="font-size:13px">Borrar datos de prueba</button></div></aside>
      <main class="p-main">${cuerpo}</main>${hoja?hojaMesaHTML(hoja,"panel"):""}</div>`;
    app.querySelectorAll(".graf").forEach(tip);
    const bc=app.querySelector("#bc"); if(bc) bc.addEventListener("input",()=>{ buscar=bc.value; const pos=bc.selectionStart; pintar(true); const n=app.querySelector("#bc"); n.focus(); n.setSelectionRange(pos,pos); });
  }
  async function clic(e){
    const t=e.target;
    if(t.closest("[data-cerrar-b]")||t.matches("[data-cerrar]")){ hoja=null; return pintar(true); }
    const tb=t.closest("[data-tab]"); if(tb){ panelTab=tb.dataset.tab; hoja=null; pintar(true); return window.scrollTo(0,0); }
    const rm=t.closest("[data-rm]"); if(rm){ modoRes=rm.dataset.rm; return pintar(true); }
    const inf=t.closest("[data-inf]"); if(inf){ periodoInf=+inf.dataset.inf; return pintar(true); }
    const pm=t.closest("[data-pm]"); if(pm){ hoja=+pm.dataset.pm; return pintar(true); }
    const ab=t.closest("[data-abrir]"); if(ab){ await Acc.abrir(+ab.dataset.abrir,"encargado"); hoja=null; toast(`Mesa ${ab.dataset.abrir} abierta.`); return pintar(true); }
    const cm=t.closest("[data-cerrar-mesa]"); if(cm){ await Acc.cerrar(+cm.dataset.cerrarMesa,"encargado"); hoja=null; toast(`Mesa ${cm.dataset.cerrarMesa} cerrada.`); return pintar(true); }
    if(t.closest("[data-repartir]")){ const tt=cfgTurno(), act=cams().filter(c=>tt.activos[c.id]!==false); if(!act.length) return toast("No hay nadie en turno."); const asign={}, N=mesasN(); for(let n=1;n<=N;n++) asign[n]=act[Math.floor((n-1)*act.length/N)].id; await Acc.turno({asign}); return toast(`Mesas repartidas entre ${act.map(c=>c.n).join(", ")}.`); }
    const cp=t.closest("[data-copiar]"); if(cp){ try{ await navigator.clipboard.writeText(location.href.split("#")[0]+"#mesa-"+cp.dataset.copiar); toast(`Enlace de la mesa ${cp.dataset.copiar} copiado.`); }catch(_){ toast("No se ha podido copiar. Mantén pulsado el enlace para copiarlo."); } return; }
    if(t.closest("[data-copiar-todo]")){ const base=location.href.split("#")[0]; try{ await navigator.clipboard.writeText(Array.from({length:mesasN()},(_,i)=>`Mesa ${i+1}: ${base}#mesa-${i+1}`).join("\n")); toast("Todos los enlaces copiados."); }catch(_){ toast("No se ha podido copiar."); } return; }
    if(t.closest("[data-copiar-inf]")){ try{ await navigator.clipboard.writeText(app.querySelector("#inf").value); toast("Informe copiado. Pégalo en WhatsApp o en un correo."); }catch(_){ app.querySelector("#inf").select(); toast("Selecciona el texto y cópialo."); } return; }
    const qp=t.closest("[data-quitar-plato]"); if(qp){ const c=cfgCarta(); await Acc.carta({extra:(c.extra||[]).filter(x=>x.id!==qp.dataset.quitarPlato)}); toast("Plato quitado de la carta."); return pintar(true); }
    if(t.closest("[data-add-cam]")){ const cont=app.querySelector("#aj-cams"), k=cont.children.length, colores=["#2f7d32","#7b3fa0","#d07a00","#227c8a","#b0306a"];
      cont.insertAdjacentHTML("beforeend",`<div class="cam-edit" data-cid="c${nid().slice(-5)}"><input type="color" value="${colores[k%colores.length]}" aria-label="Color"><input value="" placeholder="Nombre" maxlength="20" aria-label="Nombre del camarero"><button type="button" class="b-ui claro" data-quitar-cam>Quitar</button></div>`);
      cont.lastElementChild.querySelector("input:not([type=color])").focus(); toast("Escribe el nombre y pulsa «Guardar ajustes»."); return; }
    const qc=t.closest("[data-quitar-cam]"); if(qc){ const cont=app.querySelector("#aj-cams"); if(cont.children.length<2) return toast("Tiene que quedar al menos un camarero."); qc.closest(".cam-edit").remove(); toast("Pulsa «Guardar ajustes» para aplicarlo. Sus mesas pasarán a los demás."); return; }
    const cd=t.closest("[data-cerrar-dia]"); if(cd){ if(!cd.dataset.seguro){ cd.dataset.seguro=1; cd.textContent="Pulsa otra vez para confirmar"; return; } await Acc.cerrarDia(); toast("Día cerrado: resumen guardado y lo terminado, archivado."); return pintar(true); }
    const rs=t.closest("[data-reiniciar]"); if(rs){ if(!rs.dataset.seguro){ rs.dataset.seguro=1; rs.textContent="Pulsa otra vez: se borra todo"; return; } await Acc.reiniciar(); toast("Datos de prueba borrados."); return pintar(true); }
  }
  async function cambio(e){
    const t=e.target;
    if(t.dataset.disp){ const id=t.dataset.disp; await Acc.carta({agotados:{[id]:!t.checked}}); toast(t.checked?`${P(id).n} vuelve a la carta.`:`${P(id).n} agotado: desaparece de las mesas al momento.`); return pintar(true); }
    if(t.dataset.precio){ const id=t.dataset.precio, v=Math.round(parseFloat(t.value)*100)/100; if(v>0){ await Acc.carta({precios:{[id]:v}}); toast(`${P(id).n}: ${eur(v)}. Ya está en la carta.`); } else { t.value=precio(id); toast("Pon un precio mayor que 0."); } t.blur(); return pintar(true); }
    if(t.dataset.asign){ await Acc.turno({asign:{[t.dataset.asign]:t.value}}); toast(`Mesa ${t.dataset.asign} ahora la lleva ${nomCam(t.value)}.`); t.blur(); return pintar(true); }
    if(t.dataset.activo){ const tt=cfgTurno(), activos={...tt.activos,[t.dataset.activo]:t.checked}, act=cams().filter(c=>activos[c.id]!==false);
      if(!t.checked && act.length){ const asign={...tt.asign}; let i=0; Object.keys(asign).forEach(n=>{ if(asign[n]===t.dataset.activo) asign[n]=act[(i++)%act.length].id; }); await Acc.turno({activos,asign}); toast(`${nomCam(t.dataset.activo)} libra hoy. Sus mesas pasan a ${act.map(c=>c.n).join(" y ")}.`); }
      else { await Acc.turno({activos}); toast(`${nomCam(t.dataset.activo)} ${t.checked?"entra en turno.":"libra hoy."}`); } return pintar(true); }
    if(t.id==="escala"){ const v=Math.min(300,Math.max(15,+t.value||60)); await Acc.turno({escala:v}); toast(`Hecho: si nadie contesta en ${v} s, salta a todos.`); t.blur(); return pintar(true); }
    if(t.id==="mn-activo"){ await Acc.menu({activo:t.checked}); toast(t.checked?"Menú del día visible en la carta y las mesas.":"Menú del día oculto."); return pintar(true); }
  }
  async function enviar(e){
    e.preventDefault(); const f=e.target, v=id=>f.querySelector(id)?.value??"";
    if(f.id==="f-menu"){ const lineas=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
      const m={precio:Math.max(0,parseFloat(v("#mn-precio"))||0),cuando:v("#mn-cuando").trim(),incluye:v("#mn-incluye").trim(),primeros:lineas(v("#mn-1")),segundos:lineas(v("#mn-2")),postres:lineas(v("#mn-3"))};
      if(!m.primeros.length||!m.segundos.length||!m.postres.length) return toast("Pon al menos un primero, un segundo y un postre.");
      await Acc.menu(m); document.activeElement?.blur(); toast("Menú del día publicado. Ya sale en la carta y en las mesas."); return pintar(true); }
    if(f.id==="f-plato"){ const n=v("#np-n").trim(), p=parseFloat(v("#np-p")); if(!n||!(p>0)) return toast("Pon nombre y precio.");
      const c=cfgCarta(); const a=[...f.querySelectorAll(".al-sel input:checked")].map(x=>x.value);
      await Acc.carta({extra:[...(c.extra||[]),{id:"x"+nid().slice(-6),sec:v("#np-s"),n,d:v("#np-d").trim(),p,a,extra:true}]});
      document.activeElement?.blur(); toast(`${n} añadido a la carta.`); return pintar(true); }
    if(f.id==="f-bar"){ const camareros=[...f.querySelectorAll(".cam-edit")].map(r=>({id:r.dataset.cid,color:r.querySelector("input[type=color]").value,n:r.querySelector("input:not([type=color])").value.trim()||"Camarero"}));
      const mesas=Math.max(1,Math.min(99,parseInt(v("#aj-mesas"))||30));
      await Acc.bar({nombre:v("#aj-nombre").trim()||BAR_DEF.nombre,ciudad:v("#aj-ciudad").trim(),mesas,interiorHasta:Math.max(0,Math.min(mesas,parseInt(v("#aj-int"))||0)),google:v("#aj-google").trim()||BAR_DEF.google,telefono:v("#aj-tel").trim(),email:v("#aj-email").trim(),camareros});
      document.activeElement?.blur(); toast("Ajustes guardados. Se aplican al momento en todas las pantallas."); return pintar(true); }
  }
  app.addEventListener("click",clic); app.addEventListener("change",cambio); app.addEventListener("submit",enviar);
  return { titulo:"Panel · "+cfgBar().nombre, pintar:()=>pintar(), salir(){ app.removeEventListener("click",clic); app.removeEventListener("change",cambio); app.removeEventListener("submit",enviar); },
    tic(){ if(panelTab==="sala"&&!hoja){ const n=avisosAbiertos().filter(escalado).length; if(this._s!==undefined && this._s!==n) pintar(); this._s=n; } } };
}

/* ===================================================================== */
ir();
conectarDB();

</script>
</body>
</html>
